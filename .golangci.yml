version: "2"

linters:
  default: standard
  enable:
    - bodyclose      # every HTTP response body must be closed (usage/oauth polling)
    - copyloopvar    # flags the loop-var copies Go 1.22 made redundant
    - errorlint      # enforces errors.Is/As over == and type assertions
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - usetesting     # pushes t.Context()/t.Setenv() over hand-rolled equivalents

  settings:
    revive:
      rules:
        - name: exported
          disabled: true   # doc comments are enforced by review, not by lint noise

formatters:
  enable:
    - gofmt
    - goimports
