name: Bug report
description: Something in aaswap isn't working right
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you see, and what did you expect instead?
      placeholder: Ran `aaswap switch 2`, got ... — expected ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aaswap version and install method
      description: Output of `aaswap --version`, and whether you installed with Homebrew, `go install`, a downloaded binary, or from source.
      placeholder: aaswap version v1.0.0, installed with Homebrew
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Credentials are stored differently per platform, so this matters a lot.
      options:
        - macOS
        - Linux
        - Windows
        - WSL
    validations:
      required: true
  - type: dropdown
    id: claude-code
    attributes:
      label: How do you run Claude Code?
      multiple: true
      options:
        - CLI (terminal)
        - VS Code extension
        - Desktop app
  - type: textarea
    id: logs
    attributes:
      label: Command output or logs
      description: Paste the failing command's output — `aaswap list` for account-state issues, `aaswap auto` log lines for auto-switch issues. Formatted automatically, no backticks needed. Please redact emails/account identifiers, and never paste access/refresh tokens, API keys, setup tokens, or credential-file/Keychain contents.
      render: shell
