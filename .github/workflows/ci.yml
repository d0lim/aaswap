name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # Reads the version from go.mod, so CI and mise.toml cannot drift.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race because the collect pass fetches in parallel and the Keychain
      # capability cache is shared across those goroutines.
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Go 1.27 ships the modernizers inside `go fix`; -diff makes it a check
      # that fails when the tree is not already written in modern Go
      # (slices/maps, min/max, range-over-int, errors.AsType, wg.Go, ...).
      - name: Modern Go idioms
        run: go fix -diff ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  cross-compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The release ships six binaries; this catches a platform-specific build
      # break at PR time rather than at tag time.
      - name: Build every release target
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./... || exit 1
          done
